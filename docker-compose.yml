version: '3'

services:

  jenkins:

    build: .

    container_name: jenkins-server

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      - selenium



  selenium:

    image: selenium/standalone-chrome:latest

    container_name: selenium

    ports:
      - "4444:4444"

    shm_size: 2gb



volumes:

  jenkins_home:
```
